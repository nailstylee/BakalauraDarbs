<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uzdevums</title>
  <style>
    :root {
      --card-w: 720px;
      --text: #202738;
      --muted: #697389;
      --border: #d8e0ef;
      --primary: #3f72f7;
      --primary-soft: #edf2ff;
      --bad: #c84f5a;
      --bad-bg: #ffe5e8;
      --ok: #167d59;
      --ok-bg: #def6ec;
      --panel: rgba(255, 255, 255, 0.97);
      --stage-bg: #f2f5fb;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 16% 18%, rgba(91, 123, 255, 0.15), transparent 24%),
        radial-gradient(circle at 88% 13%, rgba(255, 209, 98, 0.14), transparent 18%),
        linear-gradient(180deg, #eff3fb, #e7ecf6);
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      padding: 18px;
    }

    .check-card {
      width: min(100%, var(--card-w));
      background: var(--panel);
      border: 1px solid rgba(215, 223, 239, 0.97);
      box-shadow: 0 22px 68px rgba(34, 49, 82, 0.17);
      padding: 16px;
    }

    @media (min-width: 821px) {
      .check-card {
        zoom: 0.9;
      }
    }

    .head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 17px;
      font-weight: 750;
    }

    .instructions {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--stage-bg);
    }

    .startup-fallback {
      position: absolute;
      inset: 0;
      z-index: 8;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--stage-bg);
      color: #42516f;
      text-align: center;
      font-size: 16px;
      line-height: 1.5;
    }

    .startup-fallback strong {
      display: block;
      margin-bottom: 6px;
      color: #202738;
      font-size: 18px;
    }

    .startup-fallback.hidden {
      display: none;
    }

    .stage-loading,
    .stage-message {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      color: #42516f;
      text-align: center;
      font-size: 16px;
      line-height: 1.5;
    }

    .stage-message strong {
      display: block;
      color: var(--text);
      font-size: 18px;
      margin-bottom: 6px;
    }

    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .attempts {
      flex-shrink: 0;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #f6f8ff;
      color: #42516f;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status {
      flex: 1 1 320px;
      min-height: 42px;
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fbfcff;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
      padding: 10px 12px;
    }

    .status.bad {
      background: var(--bad-bg);
      color: var(--bad);
      border-color: #f2c1c6;
    }

    .status.ok {
      background: var(--ok-bg);
      color: var(--ok);
      border-color: #bee8d6;
    }

    .buttons {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .primary {
      background: var(--primary);
      color: white;
    }

    .image-grid {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 2px;
      padding: 2px;
      background: #d9e2f0;
    }

    .cover-grid {
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
    }

    .image-cell {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      border: 0;
      border-radius: 0;
      padding: 0;
      overflow: hidden;
      background: #e9eef7;
      cursor: pointer;
      transform: none !important;
    }

    .image-cell img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      pointer-events: none;
    }

    .image-cell::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 0 solid transparent;
      box-shadow: inset 0 0 0 0 rgba(63, 114, 247, 0);
      transition: box-shadow 0.12s ease, background 0.12s ease;
    }

    .image-cell.selected::after {
      background: rgba(63, 114, 247, 0.18);
      box-shadow: inset 0 0 0 6px rgba(63, 114, 247, 0.95);
    }

    .image-cell.selected::before {
      content: "✓";
      position: absolute;
      z-index: 2;
      top: 10px;
      right: 10px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(63, 114, 247, 0.96);
      color: white;
      font-size: 22px;
      font-weight: 900;
    }

    .missing-cell {
      display: grid;
      place-items: center;
      padding: 12px;
      color: #697389;
      text-align: center;
      font-size: 13px;
      line-height: 1.35;
      background: #edf2fa;
    }

    .slide-layout {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 28px 28px 30px;
    }

    .slide-canvas-wrap {
      display: grid;
      place-items: center;
      min-height: 0;
    }

    .slide-canvas {
      width: 100%;
      height: auto;
      max-height: 100%;
      border: 1px solid rgba(32, 39, 56, 0.12);
      background: #dce4ef;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.92);
    }

    .slider-symbol {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--primary-soft);
      color: #334362;
      font-size: 18px;
      font-weight: 800;
    }

    .slider-input {
      width: 100%;
      accent-color: var(--primary);
      cursor: pointer;
      user-select: auto;
      -webkit-user-select: auto;
    }

    .text-layout {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 34px;
    }

    .text-card {
      width: min(100%, 520px);
      padding: 24px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 18px 40px rgba(34, 49, 82, 0.12);
    }

    .text-image-wrap {
      display: grid;
      place-items: center;
      min-height: 190px;
      padding: 16px;
      border: 1px solid #d8e0ef;
      background: #f7f9fd;
      margin-bottom: 18px;
    }

    .text-image {
      display: block;
      max-width: 100%;
      max-height: 240px;
      object-fit: contain;
    }

    .answer-input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #cfd8eb;
      border-radius: 12px;
      background: white;
      color: var(--text);
      font: inherit;
      font-size: 17px;
      user-select: text;
      -webkit-user-select: text;
    }

    .answer-input:focus {
      outline: 2px solid rgba(63, 114, 247, 0.22);
      border-color: var(--primary);
    }

    .check-layout {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 34px;
    }

    .check-panel {
      width: min(100%, 460px);
      padding: 28px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 18px 40px rgba(34, 49, 82, 0.12);
    }

    .check-label {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--text);
      font-size: 18px;
      line-height: 1.4;
      cursor: pointer;
      user-select: none;
    }

    .check-input {
      width: 30px;
      height: 30px;
      accent-color: var(--primary);
      cursor: pointer;
      flex: 0 0 auto;
    }

    .result-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(24, 33, 53, 0.42);
      backdrop-filter: blur(4px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.18s ease, visibility 0.18s ease;
    }

    .result-modal.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .result-card {
      width: min(100%, 410px);
      overflow: hidden;
      border: 1px solid rgba(212, 221, 238, 0.98);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.99);
      box-shadow: 0 28px 90px rgba(23, 35, 62, 0.34);
      transform: translateY(12px) scale(0.98);
      transition: transform 0.2s ease;
    }

    .result-modal.visible .result-card {
      transform: translateY(0) scale(1);
    }

    .result-topbar {
      height: 8px;
      background: linear-gradient(90deg, #3f72f7, #6b94ff);
    }

    .result-modal.failure .result-topbar {
      background: linear-gradient(90deg, #c84f5a, #e67a83);
    }

    .result-body {
      padding: 24px 24px 22px;
    }

    .result-row {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .result-icon {
      flex: 0 0 auto;
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: #def6ec;
      color: #167d59;
      box-shadow: inset 0 0 0 1px rgba(22, 125, 89, 0.12);
      font-size: 30px;
      font-weight: 900;
    }

    .result-modal.failure .result-icon {
      background: #ffe5e8;
      color: #c84f5a;
      box-shadow: inset 0 0 0 1px rgba(200, 79, 90, 0.12);
    }

    .result-copy h2 {
      margin: 2px 0 7px;
      color: #202738;
      font-size: 22px;
      line-height: 1.18;
      font-weight: 820;
    }

    .result-copy p {
      margin: 0;
      color: #697389;
      font-size: 15px;
      line-height: 1.5;
    }

    @media (max-width: 720px) {
      body {
        padding: 10px;
      }

      .check-card {
        padding: 12px;
      }

      .head {
        margin-bottom: 10px;
      }

      .bottom {
        gap: 10px;
      }

      .status {
        flex-basis: 100%;
      }

      .buttons {
        width: 100%;
      }

      .primary {
        width: 100%;
      }

      .slide-layout {
        padding: 18px 18px 22px;
        gap: 14px;
      }

      .text-layout,
      .check-layout {
        padding: 20px;
      }

      .text-card,
      .check-panel {
        padding: 18px;
      }
    }

    @media (max-width: 520px) {
      .result-body {
        padding: 21px 18px 18px;
      }

      .result-row {
        gap: 13px;
      }

      .result-icon {
        width: 50px;
        height: 50px;
        font-size: 27px;
      }

      .result-copy h2 {
        font-size: 20px;
      }

      .image-cell.selected::before {
        top: 8px;
        right: 8px;
        width: 30px;
        height: 30px;
        font-size: 19px;
      }

      .check-label {
        font-size: 17px;
      }
    }

    .result-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .completion-screen {
      width: min(100%, 720px);
      display: grid;
      place-items: center;
    }

    .completion-card {
      width: 100%;
      padding: 34px;
      border: 1px solid rgba(215, 223, 239, 0.97);
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 22px 68px rgba(34, 49, 82, 0.17);
      text-align: center;
    }

    .completion-card h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.25;
      font-weight: 820;
    }

    .completion-card p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
    }

  </style>
</head>
<body>
  <div class="check-card">
    <div class="head">
      <div>
        <h1>Uzdevums</h1>
        <p class="instructions" id="instructionsBox">Uzdevums tiek sagatavots.</p>
      </div>
    </div>

    <div class="stage" id="challengeStage">
      <div class="startup-fallback" id="startupFallback">
        <div>
          <strong>Interaktīvā pārbaude netika palaista.</strong>
          Atver šo lapu pilnā pārlūkā vai kā publicētu tīmekļa lapu, nevis faila priekšskatījumā.
        </div>
      </div>
    </div>

    <div class="bottom">
      <div class="attempts" id="attemptsBadge">Mēģinājumi: 3</div>
      <div class="status" id="statusBox">Uzdevums tiek sagatavots.</div>
      <div class="buttons">
        <button id="submitBtn" class="primary" disabled>Pārbaudīt</button>
      </div>
    </div>
  </div>

  <div class="result-modal" id="resultModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <div class="result-card">
      <div class="result-topbar"></div>
      <div class="result-body">
        <div class="result-row">
          <div class="result-icon" id="resultIcon">✓</div>
          <div class="result-copy">
            <h2 id="resultTitle">Pārbaude veiksmīga</h2>
            <p id="resultMessage" hidden></p>
          </div>
        </div>
        <div class="result-actions">
          <button id="nextTaskBtn" class="primary" type="button">Nākamais uzdevums</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = {
      ATTEMPTS_PER_ROUND: 3,

      // Nomaini uz 'random', ja pētījumā uzdevumu secībai jābūt nejaušai.
      // Uzdevuma saturs arī tad paliek pilnībā deterministisks pēc indeksa.
      SEQUENCE_MODE: 'ordered',

      STUDY_STORAGE_PREFIX: 'captchaResearchIndexedV1',
      RESULT_RECEIVER_URL: 'https://script.google.com/macros/s/AKfycbwwkKK5dTlgb_rKcJeP9mI1dIBQFagwzXhvbazYyENMmp0on5kG8s1VqE6Pr4Rbhb2N/exec',

      TEXT: {
        folder: './text/',
        manifest: 'files.js',
        manifestKey: 'text',
        prompt: 'Attēlā redzams izkropļots teksts. Ieraksti to zemāk esošajā laukā un pēc tam spied “Pārbaudīt”.',
        caseSensitive: false
      },

      SLIDE: {
        folder: './slide/',
        manifest: 'files.js',
        manifestKey: 'slide',
        prompt: 'Pabīdi slīdni, lai izgrieztā detaļa nostātos tukšajā vietā un attēls sakristu. Kad detaļa ir novietota pareizi, spied “Pārbaudīt”.',
        canvasWidth: 620,
        canvasHeight: 470,
        pieceSize: 96,
        holeMargin: 42,
        tolerancePx: 14,
        fixedLayoutsByVariant: {
          1: { pieceY: 118, targetX: 212 },
          2: { pieceY: 184, targetX: 356 },
          3: { pieceY: 248, targetX: 276 },
          4: { pieceY: 154, targetX: 438 }
        }
      },

      CHOOSE: {
        folder: './choose/',
        manifest: 'files.js',
        manifestKey: 'choose',
        promptsByVariant: {
          1: 'Atzīmē visus laukumus, kuros redzamais galvenais objekts ir dzīvs organisms. Kad esi izvēlējies visus pareizos laukumus, spied “Pārbaudīt”.',
          2: 'Atzīmē visus laukumus, kuros redzamais galvenais objekts ir dzīvs organisms. Kad esi izvēlējies visus pareizos laukumus, spied “Pārbaudīt”.',
          3: 'Atzīmē visus laukumus, kuros redzams velosipēds. Kad esi izvēlējies visus pareizos laukumus, spied “Pārbaudīt”.',
          4: 'Atzīmē visus laukumus, kuros redzama sarkana mašīna. Kad esi izvēlējies visus pareizos laukumus, spied “Pārbaudīt”.'
        }
      },

      COVER: {
        folder: './cover/',
        manifest: 'files.js',
        manifestKey: 'cover',
        promptsByVariant: {
          1: 'Atzīmē visus laukumus, kuros ietilpst mopēds. Kad esi izvēlējies visus pareizos laukumus, spied “Pārbaudīt”.',
          2: 'Atzīmē visus laukumus, kuros ietilpst velosipēds. Kad esi izvēlējies visus pareizos laukumus, spied “Pārbaudīt”.',
          3: 'Atzīmē visus laukumus, kuros ietilpst velosipēds. Kad esi izvēlējies visus pareizos laukumus, spied “Pārbaudīt”.',
          4: 'Atzīmē visus laukumus, kuros ietilpst mopēdi. Kad esi izvēlējies visus pareizos laukumus, spied “Pārbaudīt”.'
        }
      }
    };

    const TASK_CATALOG = Object.freeze({
      1:  { index: 1,  type: 'text',   variant: 1, page: 'puzzle_text.html' },
      2:  { index: 2,  type: 'text',   variant: 2, page: 'puzzle_text.html' },
      3:  { index: 3,  type: 'text',   variant: 3, page: 'puzzle_text.html' },
      4:  { index: 4,  type: 'text',   variant: 4, page: 'puzzle_text.html' },
      5:  { index: 5,  type: 'slide',  variant: 1, page: 'puzzle_slide.html' },
      6:  { index: 6,  type: 'slide',  variant: 2, page: 'puzzle_slide.html' },
      7:  { index: 7,  type: 'slide',  variant: 3, page: 'puzzle_slide.html' },
      8:  { index: 8,  type: 'slide',  variant: 4, page: 'puzzle_slide.html' },
      9:  { index: 9,  type: 'choose', variant: 1, page: 'puzzle_choose.html' },
      10: { index: 10, type: 'choose', variant: 2, page: 'puzzle_choose.html' },
      11: { index: 11, type: 'choose', variant: 3, page: 'puzzle_choose.html' },
      12: { index: 12, type: 'choose', variant: 4, page: 'puzzle_choose.html' },
      13: { index: 13, type: 'cover',  variant: 1, page: 'puzzle_cover.html' },
      14: { index: 14, type: 'cover',  variant: 2, page: 'puzzle_cover.html' },
      15: { index: 15, type: 'cover',  variant: 3, page: 'puzzle_cover.html' },
      16: { index: 16, type: 'cover',  variant: 4, page: 'puzzle_cover.html' }
    });

    const ALL_TASK_INDICES = Object.freeze(
      Object.keys(TASK_CATALOG).map(function(value) { return Number(value); })
    );

    const stage = document.getElementById('challengeStage');
    const startupFallback = document.getElementById('startupFallback');
    const instructionsBox = document.getElementById('instructionsBox');
    const attemptsBadge = document.getElementById('attemptsBadge');
    const statusBox = document.getElementById('statusBox');
    const submitBtn = document.getElementById('submitBtn');
    const resultModal = document.getElementById('resultModal');
    const resultIcon = document.getElementById('resultIcon');
    const resultTitle = document.getElementById('resultTitle');
    const resultMessage = document.getElementById('resultMessage');
    const nextTaskBtn = document.getElementById('nextTaskBtn');

    if (startupFallback) {
      startupFallback.classList.add('hidden');
    }

    const urlParams = new URLSearchParams(window.location.search);
    const sequenceMode = resolveSequenceMode();
    const storageKeys = {
      order: CONFIG.STUDY_STORAGE_PREFIX + ':order:' + sequenceMode,
      results: CONFIG.STUDY_STORAGE_PREFIX + ':results:' + sequenceMode
    };

    if (urlParams.get('reset') === '1') {
      removeStoredValue(storageKeys.order);
      removeStoredValue(storageKeys.results);
    }

    let studyOrder = loadOrCreateStudyOrder();
    let currentChallenge = null;
    let currentTask = null;
    let currentTaskIndex = null;
    let currentTaskStartedAt = null;
    let attemptsUsed = 0;
    let gameEnded = false;
    let generationId = 0;

    function resolveSequenceMode() {
      const requested = String(urlParams.get('order') || '').trim().toLowerCase();
      if (requested === 'ordered' || requested === 'random') {
        return requested;
      }

      const configured = String(CONFIG.SEQUENCE_MODE || 'ordered').trim().toLowerCase();
      return configured === 'random' ? 'random' : 'ordered';
    }

    function parseTaskIndex(rawValue) {
      const value = Number(rawValue);
      return Number.isInteger(value) && TASK_CATALOG[value] ? value : null;
    }

    function currentPageFileName() {
      const raw = window.location.pathname.split('/').pop() || '';
      try {
        return decodeURIComponent(raw);
      } catch (error) {
        return raw;
      }
    }

    function normalizeStoredOrder(order) {
      if (!Array.isArray(order) || order.length !== ALL_TASK_INDICES.length) {
        return null;
      }

      const values = order.map(function(value) { return Number(value); });
      const valid = values.every(function(value) {
        return Number.isInteger(value) && Boolean(TASK_CATALOG[value]);
      });

      if (!valid || new Set(values).size !== ALL_TASK_INDICES.length) {
        return null;
      }

      return values;
    }

    function readStoredJson(key, fallbackValue) {
      try {
        const raw = sessionStorage.getItem(key);
        if (!raw) return fallbackValue;
        return JSON.parse(raw);
      } catch (error) {
        return fallbackValue;
      }
    }

    function writeStoredJson(key, value) {
      try {
        sessionStorage.setItem(key, JSON.stringify(value));
      } catch (error) {
      }
    }

    function removeStoredValue(key) {
      try {
        sessionStorage.removeItem(key);
      } catch (error) {
      }
    }

    function shuffleTaskIndices(indices) {
      const copy = indices.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = copy[i];
        copy[i] = copy[j];
        copy[j] = temp;
      }
      return copy;
    }

    function loadOrCreateStudyOrder() {
      const stored = normalizeStoredOrder(readStoredJson(storageKeys.order, null));
      if (stored) return stored;

      const created = sequenceMode === 'random'
        ? shuffleTaskIndices(ALL_TASK_INDICES)
        : ALL_TASK_INDICES.slice();

      writeStoredJson(storageKeys.order, created);
      return created;
    }

    function loadStoredResults() {
      const raw = readStoredJson(storageKeys.results, []);
      if (!Array.isArray(raw)) return [];

      return raw.filter(function(item) {
        return item &&
          Number.isInteger(Number(item.taskIndex)) &&
          Boolean(TASK_CATALOG[Number(item.taskIndex)]);
      });
    }

    function saveStoredResults(results) {
      writeStoredJson(storageKeys.results, results);
    }

    function upsertStoredResult(result) {
      const results = loadStoredResults().filter(function(item) {
        return Number(item.taskIndex) !== Number(result.taskIndex);
      });

      results.push(result);
      saveStoredResults(results);
      return results;
    }

    function completedTaskIndexSet(results) {
      return new Set(results.map(function(item) { return Number(item.taskIndex); }));
    }

    function allTasksCompleted(results) {
      const completed = completedTaskIndexSet(results);
      return ALL_TASK_INDICES.every(function(index) { return completed.has(index); });
    }

    function firstIncompleteTaskIndex(results) {
      const completed = completedTaskIndexSet(results);
      for (let i = 0; i < studyOrder.length; i++) {
        if (!completed.has(studyOrder[i])) {
          return studyOrder[i];
        }
      }
      return null;
    }

    function taskPositionInSequence(taskIndex) {
      const position = studyOrder.indexOf(taskIndex);
      return position >= 0 ? position + 1 : '';
    }

    function buildTaskUrl(taskIndex) {
      const task = TASK_CATALOG[taskIndex];
      const params = new URLSearchParams();
      params.set('index', String(taskIndex));
      params.set('order', sequenceMode);
      return task.page + '?' + params.toString();
    }

    function redirectToCorrectTaskPage(taskIndex) {
      const task = TASK_CATALOG[taskIndex];
      if (!task) return false;

      if (currentPageFileName() !== task.page) {
        window.location.replace(buildTaskUrl(taskIndex));
        return true;
      }

      return false;
    }

    function determineInitialTaskIndex() {
      const explicit = parseTaskIndex(urlParams.get('index') || urlParams.get('task'));
      if (explicit) return explicit;

      const results = loadStoredResults();
      if (allTasksCompleted(results)) return null;

      return firstIncompleteTaskIndex(results) || studyOrder[0] || 1;
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

    function normalizePath(folder, file) {
      const prefix = folder.endsWith('/') ? folder : folder + '/';
      return prefix + file;
    }

    function baseName(path) {
      return String(path).split('/').pop().split('?')[0].split('#')[0];
    }

    function fileStem(path) {
      return baseName(path).replace(/\.[^.]+$/, '');
    }

    const manifestCache = new Map();

    function getManifestStore() {
      if (!window.VERIFICATION_FILE_LISTS) {
        window.VERIFICATION_FILE_LISTS = {};
      }
      return window.VERIFICATION_FILE_LISTS;
    }

    function loadScript(url) {
      return new Promise(function(resolve, reject) {
        const script = document.createElement('script');
        script.src = url;
        script.async = true;
        script.onload = function() {
          resolve();
        };
        script.onerror = function() {
          reject(new Error('Manifest script failed to load: ' + url));
        };
        document.head.appendChild(script);
      });
    }

    async function loadManifest(folder, manifestName, manifestKey) {
      const url = normalizePath(folder, manifestName);
      const cacheKey = manifestKey + '::' + url;

      if (manifestCache.has(cacheKey)) {
        return manifestCache.get(cacheKey);
      }

      const promise = (async function() {
        const store = getManifestStore();

        if (!Array.isArray(store[manifestKey])) {
          await loadScript(url);
        }

        const files = store[manifestKey];
        if (!Array.isArray(files)) {
          throw new Error('Manifest did not define VERIFICATION_FILE_LISTS.' + manifestKey);
        }

        return files
          .map(function(item) { return String(item).trim(); })
          .filter(function(item) { return Boolean(item); });
      })();

      manifestCache.set(cacheKey, promise);
      return promise;
    }

    function loadImage(url) {
      return new Promise(function(resolve, reject) {
        const image = new Image();
        image.onload = function() { resolve(image); };
        image.onerror = function() { reject(new Error('Image failed to load: ' + url)); };
        image.src = url;
      });
    }

    function selectedSetEquals(selected, correct) {
      if (selected.size !== correct.size) return false;
      for (const value of selected) {
        if (!correct.has(value)) return false;
      }
      return true;
    }

    function parseChooseFile(fileName) {
      const match = /^([1-9])_(correct|wrong)_([1-4])$/i.exec(fileStem(fileName));
      if (!match) return null;

      return {
        cellIndex: Number(match[1]),
        correct: match[2].toLowerCase() === 'correct',
        variant: Number(match[3]),
        fileName: fileName
      };
    }

    function parseCoverFile(fileName) {
      const match = /^(1[0-6]|[1-9])_(correct|wrong)_([1-4])$/i.exec(fileStem(fileName));
      if (!match) return null;

      return {
        cellIndex: Number(match[1]),
        correct: match[2].toLowerCase() === 'correct',
        variant: Number(match[3]),
        fileName: fileName
      };
    }

      setReadyChallenge({
        type: 'cover',

          return selectedSetEquals(selected, correct);

      });

    function drawCover(ctx, image, targetWidth, targetHeight) {
      const imageRatio = image.width / image.height;
      const targetRatio = targetWidth / targetHeight;

      let drawWidth = targetWidth;
      let drawHeight = targetHeight;
      let offsetX = 0;
      let offsetY = 0;

      if (imageRatio > targetRatio) {
        drawHeight = targetHeight;
        drawWidth = drawHeight * imageRatio;
        offsetX = (targetWidth - drawWidth) / 2;
      } else {
        drawWidth = targetWidth;
        drawHeight = drawWidth / imageRatio;
        offsetY = (targetHeight - drawHeight) / 2;
      }

      ctx.drawImage(image, offsetX, offsetY, drawWidth, drawHeight);
    }

    function drawPiecePath(ctx, x, y, size) {
      const radius = size * 0.18;
      const bumpRadius = size * 0.15;
      const bumpCenterX = x + size * 0.52;
      const bumpCenterY = y - bumpRadius * 0.1;
      const notchCenterX = x + size * 0.96;
      const notchCenterY = y + size * 0.55;

      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(bumpCenterX - bumpRadius, y);
      ctx.bezierCurveTo(
        bumpCenterX - bumpRadius * 0.85, y - bumpRadius * 0.92,
        bumpCenterX + bumpRadius * 0.85, y - bumpRadius * 0.92,
        bumpCenterX + bumpRadius, y
      );
      ctx.lineTo(x + size - radius, y);
      ctx.quadraticCurveTo(x + size, y, x + size, y + radius);
      ctx.lineTo(x + size, notchCenterY - bumpRadius);
      ctx.bezierCurveTo(
        x + size + bumpRadius * 0.92, notchCenterY - bumpRadius * 0.82,
        x + size + bumpRadius * 0.92, notchCenterY + bumpRadius * 0.82,
        x + size, notchCenterY + bumpRadius
      );
      ctx.lineTo(x + size, y + size - radius);
      ctx.quadraticCurveTo(x + size, y + size, x + size - radius, y + size);
      ctx.lineTo(x + radius, y + size);
      ctx.quadraticCurveTo(x, y + size, x, y + size - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function clampNumber(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    async function createSliderChallenge(localGenerationId, task) {
      const setup = CONFIG.SLIDE;
      setInstructions(setup.prompt);
      showLoading('Attēls tiek ielādēts.');

      let files = [];
      try {
        files = await loadManifest(setup.folder, setup.manifest, setup.manifestKey);
      } catch (error) {
        if (localGenerationId !== generationId || gameEnded) return;
        showStageMessage('Trūkst slide failu saraksta.', 'Pievieno slide/files.js ar attēlu failu nosaukumiem.');
        setStatus('Nav ielādēta attēlu kopa.', 'bad');
        return;
      }

      if (localGenerationId !== generationId || gameEnded) return;

      const file = files[task.variant - 1];
      if (!file) {
        showStageMessage(
          'Slide variants nav atrasts.',
          'Indeksam ' + task.index + ' vajag ' + task.variant + '. failu slide/files.js sarakstā.'
        );
        setStatus('Nav atrasts attēls.', 'bad');
        return;
      }

      let image = null;
      const chosenPath = normalizePath(setup.folder, file);
      try {
        image = await loadImage(chosenPath);
      } catch (error) {
        if (localGenerationId !== generationId || gameEnded) return;
        showStageMessage('Attēls nav atrasts.', 'Pārbaudi slide/files.js un faila nosaukumu.');
        setStatus('Nav ielādēts attēls.', 'bad');
        return;
      }

      if (localGenerationId !== generationId || gameEnded) return;

      const layout = document.createElement('div');
      layout.className = 'slide-layout';

      const canvasWrap = document.createElement('div');
      canvasWrap.className = 'slide-canvas-wrap';

      const canvas = document.createElement('canvas');
      canvas.className = 'slide-canvas';
      canvas.width = setup.canvasWidth;
      canvas.height = setup.canvasHeight;

      const sliderRow = document.createElement('div');
      sliderRow.className = 'slider-row';

      const symbol = document.createElement('div');
      symbol.className = 'slider-symbol';
      symbol.textContent = '↔';

      const slider = document.createElement('input');
      slider.type = 'range';
      slider.className = 'slider-input';
      slider.min = '0';
      slider.max = '1000';
      slider.step = '1';

      sliderRow.appendChild(symbol);
      sliderRow.appendChild(slider);
      canvasWrap.appendChild(canvas);
      layout.appendChild(canvasWrap);
      layout.appendChild(sliderRow);

      stage.innerHTML = '';
      stage.appendChild(layout);

      const ctx = canvas.getContext('2d');
      const renderedImage = document.createElement('canvas');
      renderedImage.width = canvas.width;
      renderedImage.height = canvas.height;
      const renderedCtx = renderedImage.getContext('2d');
      drawCover(renderedCtx, image, renderedImage.width, renderedImage.height);

      const pieceSize = setup.pieceSize;
      const holeMargin = setup.holeMargin;
      const minPieceY = holeMargin + 18;
      const maxPieceY = canvas.height - pieceSize - holeMargin - 18;
      const minTargetX = holeMargin + pieceSize;
      const maxTargetX = canvas.width - pieceSize - holeMargin;
      const minPieceX = holeMargin;
      const maxPieceX = canvas.width - pieceSize - holeMargin;
      const fixedLayout = setup.fixedLayoutsByVariant[task.variant] || setup.fixedLayoutsByVariant[1];
      const pieceY = clampNumber(fixedLayout.pieceY, minPieceY, maxPieceY);
      const targetX = clampNumber(fixedLayout.targetX, minTargetX, maxTargetX);

      function pieceXFromSlider() {
        const ratio = Number(slider.value) / 1000;
        return minPieceX + (maxPieceX - minPieceX) * ratio;
      }

      function sliderValueForX(x) {
        return Math.round(((x - minPieceX) / (maxPieceX - minPieceX)) * 1000);
      }

      const initialCandidateX = Math.abs(targetX - minPieceX) > Math.abs(targetX - maxPieceX) ? minPieceX : maxPieceX;
      slider.value = String(sliderValueForX(initialCandidateX));

      function redraw() {
        const currentX = pieceXFromSlider();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(renderedImage, 0, 0);

        ctx.save();
        drawPiecePath(ctx, targetX, pieceY, pieceSize);
        ctx.fillStyle = 'rgba(25, 34, 52, 0.52)';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.86)';
        ctx.stroke();
        ctx.restore();

        ctx.save();
        drawPiecePath(ctx, currentX, pieceY, pieceSize);
        ctx.clip();
        ctx.drawImage(renderedImage, currentX - targetX, 0);
        ctx.restore();

        ctx.save();
        drawPiecePath(ctx, currentX, pieceY, pieceSize);
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.shadowColor = 'rgba(20, 30, 50, 0.38)';
        ctx.shadowBlur = 10;
        ctx.stroke();
        ctx.restore();
      }

      slider.addEventListener('input', redraw);
      redraw();

      setStatus('Pabīdi detaļu un spied “Pārbaudīt”.', 'neutral');
      setReadyChallenge({
        type: 'slide',
        imagePath: chosenPath,
        validate: function() {
          return Math.abs(pieceXFromSlider() - targetX) <= setup.tolerancePx;
        }
      });
    }

      return fileStem(path);

            return typed === answer;
          }
          return typed.toLowerCase() === answer.toLowerCase();
        }
      });
    }

    async function createIndexedChallenge(localGenerationId, task) {
      if (!task) {
        showStageMessage('Uzdevuma indekss nav derīgs.', 'Izmanto indeksu no 1 līdz 16.');
        setStatus('Uzdevumu nevar ielādēt.', 'bad');
        return;
      }

      if (task.type === 'cover') {
        await createCoverChallenge(localGenerationId, task);
        return;
      }

      if (task.type === 'choose') {
        await createChooseChallenge(localGenerationId, task);
        return;
      }

      if (task.type === 'slide') {
        await createSliderChallenge(localGenerationId, task);
        return;
      }

      if (task.type === 'text') {
        await createTextImageChallenge(localGenerationId, task);
        return;
      }

      showStageMessage('Nezināms uzdevuma tips.', 'Pārbaudi TASK_CATALOG konfigurāciju.');
      setStatus('Uzdevumu nevar ielādēt.', 'bad');
    }

    function startIndexedRound(taskIndex, message) {
      currentTaskIndex = taskIndex;
      currentTask = TASK_CATALOG[taskIndex] || null;
      attemptsUsed = 0;
      currentChallenge = null;
      gameEnded = false;
      submitBtn.disabled = true;
      updateAttempts();
      currentTaskStartedAt = null;

      if (currentTask) {
        document.title = 'Uzdevums ' + currentTask.index;
      }

      setStatus(message || 'Uzdevums tiek sagatavots.', 'neutral');
      generationId += 1;
      createIndexedChallenge(generationId, currentTask);
    }

    function sequencePositionForResult(taskIndex) {
      const position = studyOrder.indexOf(taskIndex);
      return position >= 0 ? position + 1 : '';
    }

    function recordCurrentResult(isHuman) {
      const endedAtMs = Date.now();
      const durationMs = currentTaskStartedAt ? Math.max(0, endedAtMs - currentTaskStartedAt) : '';
      const attemptsMade = isHuman ? attemptsUsed + 1 : attemptsUsed;

      return upsertStoredResult({
        taskIndex: currentTask.index,
        taskType: currentTask.type,
        variant: currentTask.variant,
        success: Boolean(isHuman),
        attemptsMade: attemptsMade,
        durationMs: durationMs,
        completedAt: new Date(endedAtMs).toISOString(),
        sequenceMode: sequenceMode,
        sequencePosition: sequencePositionForResult(currentTask.index)
      });
    }

    function nextIncompleteTaskAfterCurrent(results) {
      const completed = completedTaskIndexSet(results);
      const currentPosition = studyOrder.indexOf(currentTaskIndex);

      if (currentPosition >= 0) {
        for (let i = currentPosition + 1; i < studyOrder.length; i++) {
          if (!completed.has(studyOrder[i])) {
            return studyOrder[i];
          }
        }
      }

      return firstIncompleteTaskIndex(results);
    }

    function showResultModal(isHuman, results) {
      resultModal.classList.toggle('failure', !isHuman);
      resultModal.classList.add('visible');
      resultModal.setAttribute('aria-hidden', 'false');

      if (isHuman) {
        resultIcon.textContent = '✓';
        resultTitle.textContent = 'Pārbaude veiksmīga';
      } else {
        resultIcon.textContent = '×';
        resultTitle.textContent = 'Pārbaude neizdevās';
      }

      resultMessage.hidden = true;
      nextTaskBtn.textContent = allTasksCompleted(results) ? 'Skatīt rezultātus' : 'Nākamais uzdevums';
    }

    function endGame(isHuman) {
      if (gameEnded) return;
      gameEnded = true;
      submitBtn.disabled = true;

      if (isHuman) {
        setStatus('Uzdevums pabeigts.', 'ok');
      } else {
        setStatus('Uzdevums pabeigts.', 'bad');
      }

      const results = recordCurrentResult(isHuman);
      showResultModal(isHuman, results);
    }

    function failAttempt() {
      attemptsUsed += 1;
      updateAttempts();

      const remaining = CONFIG.ATTEMPTS_PER_ROUND - attemptsUsed;
      if (remaining > 0) {
        const attemptWord = remaining === 1 ? 'mēģinājums' : 'mēģinājumi';
        setStatus('Nepareizi. Atlikuši ' + remaining + ' ' + attemptWord + '.', 'bad');
        return;
      }

      endGame(false);
    }

    function checkCurrentChallenge() {
      if (gameEnded || !currentChallenge) return;

      let passed = false;
      try {
        passed = Boolean(currentChallenge.validate());
      } catch (error) {
        passed = false;
      }

      if (passed) {
        endGame(true);
      } else {
        failAttempt();
      }
    }

    function csvEscape(value) {
      const text = String(value == null ? '' : value);
      return '"' + text.replace(/"/g, '""') + '"';
    }

    function downloadResultsCsv() {
      const results = loadStoredResults();
      const byTaskIndex = new Map();
      results.forEach(function(item) {
        byTaskIndex.set(Number(item.taskIndex), item);
      });

      const orderedResults = studyOrder
        .map(function(taskIndex) { return byTaskIndex.get(taskIndex); })
        .filter(function(item) { return Boolean(item); });

      const header = [
        'task_index',
        'task_type',
        'variant',
        'success',
        'attempts_made',
        'duration_ms',
        'completed_at',
        'sequence_mode',
        'sequence_position'
      ];

      const rows = orderedResults.map(function(item) {
        return [
          item.taskIndex,
          item.taskType,
          item.variant,
          item.success,
          item.attemptsMade,
          item.durationMs,
          item.completedAt,
          item.sequenceMode,
          item.sequencePosition
        ].map(csvEscape).join(',');
      });

      const csv = '\uFEFF' + header.map(csvEscape).join(',') + '\r\n' + rows.join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const downloadUrl = URL.createObjectURL(blob);
      const link = document.createElement('a');
      const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
      link.href = downloadUrl;
      link.download = 'petijuma_rezultati_' + timestamp + '.csv';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(downloadUrl);
    }
    function getOrCreateSessionId() {
      const key = CONFIG.STUDY_STORAGE_PREFIX + ':sessionId';

      try {
        let sessionId = sessionStorage.getItem(key);

        if (!sessionId) {
          sessionId =
            'session_' +
            new Date().toISOString().replace(/[:.]/g, '-') +
            '_' +
            Math.random().toString(36).slice(2, 10);

          sessionStorage.setItem(key, sessionId);
        }

        return sessionId;
      } catch (error) {
        return 'session_' + Date.now();
      }
    }

    function submitResultsToGoogleSheets() {
      const url = CONFIG.RESULT_RECEIVER_URL;

      if (!url || url.includes('TE_IEKOPĒ')) {
        console.warn('Google Sheets result receiver URL is not configured.');
        return Promise.resolve(false);
      }

      const results = loadStoredResults();

      const payload = {
        sessionId: getOrCreateSessionId(),
        submittedAt: new Date().toISOString(),
        sequenceMode: sequenceMode,
        studyOrder: studyOrder,
        results: results
      };

      const body = new URLSearchParams();
      body.set('payload', JSON.stringify(payload));

      return fetch(url, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: body.toString(),
        keepalive: true
      })
        .then(function () {
          return true;
        })
        .catch(function (error) {
          console.error('Result submission failed:', error);
          return false;
        });
    }
    function showCompletionScreen() {
      document.title = 'Pētījums pabeigts';

      document.body.innerHTML =
        '<div class="completion-screen">' +
          '<div class="completion-card">' +
            '<h1>Paldies, ka piedalījies pētījumā!</h1>' +
            '<p id="submissionStatus">Rezultāti tiek nosūtīti...</p>' +
            '<button id="downloadResultsBtn" class="primary" type="button">Lejupielādēt rezultātus</button>' +
          '</div>' +
        '</div>';

      const downloadResultsBtn = document.getElementById('downloadResultsBtn');
      const submissionStatus = document.getElementById('submissionStatus');

      if (downloadResultsBtn) {
        downloadResultsBtn.addEventListener('click', downloadResultsCsv);
      }

      submitResultsToGoogleSheets().then(function(sent) {
        if (!submissionStatus) return;

        if (sent) {
          submissionStatus.textContent =
            'Rezultāti ir nosūtīti. Spied zemāk, ja vēlies lejupielādēt arī savu rezultātu kopiju.';
        } else {
          submissionStatus.textContent =
            'Automātiska nosūtīšana neizdevās. Spied zemāk, lai lejupielādētu rezultātus un nosūtītu tos pētniekam manuāli.';
        }
      });
    }

    function continueToNextTask() {
      const results = loadStoredResults();

      if (allTasksCompleted(results)) {
        showCompletionScreen();
        return;
      }

      const nextTaskIndex = nextIncompleteTaskAfterCurrent(results);
      if (!nextTaskIndex) {
        showCompletionScreen();
        return;
      }

      window.location.href = buildTaskUrl(nextTaskIndex);
    }

    submitBtn.addEventListener('click', checkCurrentChallenge);
    nextTaskBtn.addEventListener('click', continueToNextTask);

    const initialTaskIndex = determineInitialTaskIndex();
    if (!initialTaskIndex) {
      showCompletionScreen();
    } else if (!redirectToCorrectTaskPage(initialTaskIndex)) {
      startIndexedRound(initialTaskIndex, 'Uzdevums tiek sagatavots.');
    }
  </script>
